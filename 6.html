<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>6: Bouncing Circles</title>
    <style>body,html{margin:0;padding:0;overflow:hidden;background:#000;}canvas{display:block;width:100vw;height:100vh;}.back{position:absolute;top:20px;right:20px;color:#fff;background:#3b82f6;padding:10px;text-decoration:none;font-family:sans-serif;font-weight:bold;border-radius:4px;z-index:1000;}</style>
</head>
<body>
    <a href="index.html" class="back">← НАЗАД В МЕНЮ</a>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth, h = canvas.height = window.innerHeight;
        const mem = document.createElement('canvas'), mCtx = mem.getContext('2d');
        mem.width = w; mem.height = h;
        function base() { [ctx, mCtx].forEach(c => { c.fillStyle = '#0f172a'; c.fillRect(0,0,w,h); c.strokeStyle = '#38bdf8'; for(let i=0;i<w;i+=60){c.beginPath();c.moveTo(i,0);c.lineTo(i,h);c.stroke();} }); }
        const circles = []; for(let i=0; i<8; i++) { circles.push({x:w/2, y:h/2, vx:Math.random()*6+4, vy:Math.random()*6+4, r:Math.random()*25+20, hue:Math.random()*360}); }
        base(); window.addEventListener('click', (e) => { if(e.target.className!=='back') base(); });
        window.addEventListener('resize', () => { w=canvas.width=mem.width=window.innerWidth; h=canvas.height=mem.height=window.innerHeight; base(); });
        let last = performance.now();
        function loop(now) {
            let dt = (now - last) / (1000 / 60); if(isNaN(dt) || dt > 3) dt = 1; last = now;
            mCtx.drawImage(canvas, 0, 0);
            circles.forEach(c => {
                c.x += c.vx * dt; c.y += c.vy * dt;
                if(c.x - c.r < 0 || c.x + c.r > w) { c.vx *= -1; c.hue = (c.hue + 30) % 360; }
                if(c.y - c.r < 0 || c.y + c.r > h) { c.vy *= -1; c.hue = (c.hue + 30) % 360; }
                ctx.save(); ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.clip();
                ctx.drawImage(mem, c.x - c.r, c.y - c.r, c.r*2, c.r*2, c.x - c.r + c.vx, c.y - c.r + c.vy, c.r*2, c.r*2);
                ctx.globalCompositeOperation = 'difference'; ctx.fillStyle = `hsl(${c.hue}, 100%, 50%)`;
                ctx.beginPath(); ctx.arc(c.x, c.y, c.r - 2, 0, Math.PI*2); ctx.fill(); ctx.restore();
            });
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>1: Ghost Injector</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #0c0f1d; cursor: crosshair; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .back { position: absolute; top: 20px; right: 20px; color: #fff; background: #3b82f6; padding: 10px; text-decoration: none; font-family: sans-serif; font-weight: bold; border-radius: 4px; z-index: 1000; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← НАЗАД В МЕНЮ</a>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth, h = canvas.height = window.innerHeight;
        const mem = document.createElement('canvas'), mCtx = mem.getContext('2d');
        mem.width = w; mem.height = h;
        
        let isDraw = false, mx = w / 2, my = h / 2; // Координаты по умолчанию в центре

        function base() { 
            [ctx, mCtx].forEach(c => { 
                c.fillStyle = '#0c0f1d'; c.fillRect(0, 0, w, h); 
                c.strokeStyle = '#1e293b'; 
                for(let i = 0; i < w; i += 50) { c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke(); } 
            }); 
        }
        
        base(); 
        window.addEventListener('click', (e) => { if(e.target.className !== 'back') base(); });
        
        // Отслеживаем координаты мыши ВСЕГДА, даже когда кнопка отпущена
        window.addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; });
        
        window.addEventListener('mousedown', (e) => { if(e.target.className !== 'back') isDraw = true; }); 
        window.addEventListener('mouseup', () => isDraw = false);
        window.addEventListener('resize', () => { w = canvas.width = mem.width = window.innerWidth; h = canvas.height = mem.height = window.innerHeight; base(); });
        
        let last = performance.now();

        function loop(now) {
            let dt = (now - last) / (1000 / 60); if(isNaN(dt) || dt > 3) dt = 1; last = now;
            mCtx.drawImage(canvas, 0, 0);
            
            // ЕСЛИ МЫШКА ЗАЖАТА — лавина бесконечно фигачит по циклу requestAnimationFrame, даже если мышь не двигается!
            if (isDraw) {
                ctx.save(); 
                ctx.translate(mx, my); 
                ctx.rotate(0.02 * dt); 
                ctx.scale(Math.pow(0.99, dt), Math.pow(0.99, dt)); 
                ctx.translate(-mx, -my); 
                ctx.drawImage(mem, 0, 0); 
                ctx.restore();
                
                // Генерируем по несколько фейковых окон ошибок ЗА ОДИН КАДР для бешеной скорости
                for(let k = 0; k < 2; k++) {
                    ctx.save(); 
                    ctx.fillStyle = '#020617'; 
                    ctx.strokeStyle = `hsl(${Math.random() * 360}, 100%, 50%)`; 
                    ctx.lineWidth = 3;
                    
                    // Разброс окон строго вокруг текущей позиции курсора
                    let rx = mx + (Math.random() * 80 - 40) - 100;
                    let ry = my + (Math.random() * 80 - 40) - 50;
                    
                    ctx.fillRect(rx, ry, 200, 100); 
                    ctx.strokeRect(rx, ry, 200, 100);
                    
                    ctx.fillStyle = ctx.strokeStyle; 
                    ctx.fillRect(rx, ry, 200, 20); 
                    
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 12px monospace';
                    ctx.fillText('X', rx + 185, ry + 15);
                    ctx.fillText('SYSTEM ERROR', rx + 10, ry + 15);
                    
                    ctx.fillStyle = '#ff0055';
                    ctx.font = 'bold 11px monospace';
                    ctx.fillText('CRITICAL_INJECT.EXE', rx + 15, ry + 60);
                    ctx.beginPath(); ctx.arc(rx + 160, ry + 55, 10, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.fillText('!', rx + 158, ry + 59);
                    
                    ctx.restore();
                }
            } else {
                // Если мышка отпущена — обычный Hydrogen-спираль
                ctx.save(); ctx.translate(w / 2, h / 2); ctx.rotate(0.002 * dt); ctx.translate(-w / 2, -h / 2); ctx.drawImage(mem, 0, 0); ctx.restore();
            }
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
